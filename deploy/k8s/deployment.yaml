apiVersion: apps/v1
kind: Deployment
metadata:
  name: axoview-api
  namespace: axoview
  labels:
    app.kubernetes.io/name: axoview
    app.kubernetes.io/component: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: axoview
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: axoview
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: axoview-api
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          # The deployment workflow replaces this marker with the immutable ECR image URI.
          image: axoview-backend:local
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: BACKEND_PORT
              value: "3001"
            # IMPORTANT: the upstream filesystem adapter is single-process and is
            # not a multi-tenant/distributed store. Keep it disabled while the
            # tenant-aware S3/DynamoDB adapter is being built.
            - name: ENABLE_SERVER_STORAGE
              value: "false"
            - name: AUTH_MODE
              value: none
            - name: PUBLIC_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: axoview-runtime
                  key: PUBLIC_BASE_URL
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
