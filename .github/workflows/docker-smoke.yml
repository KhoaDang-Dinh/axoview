# Production backend image smoke.
#
# Axoview's AWS production architecture serves the frontend from S3/CloudFront.
# The container artifact therefore contains only the Node/Express API.
#
# This gate deliberately builds Dockerfile.backend (the EKS artifact), starts it
# with server storage disabled, and probes the minimal runtime contract:
#   - /healthz is healthy;
#   - /api/config is reachable and reports serverStorage=false;
#   - a storage-backed API route fails closed with 503.
#
# The older combined nginx+frontend Docker path remains covered separately by
# Docker regression for upstream/local compatibility, but it is not the AWS
# production artifact.

name: Docker smoke

on:
  pull_request:
    branches: ["dev", "master"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["dev", "master", "gate-proof/**"]
  workflow_dispatch:

concurrency:
  group: docker-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-smoke:
    name: Docker smoke
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend production image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          load: true
          tags: axoview-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start backend container
        run: |
          docker run -d             --name axoview-backend-ci             -p 3001:3001             -e NODE_ENV=production             -e ENABLE_SERVER_STORAGE=false             -e PUBLIC_BASE_URL=http://127.0.0.1:3001             axoview-backend:ci

      - name: Wait for health
        shell: bash
        run: |
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:3001/healthz >/dev/null; then
              exit 0
            fi

            if ! docker inspect -f '{{.State.Running}}' axoview-backend-ci 2>/dev/null | grep -q true; then
              echo "::error::Backend container exited before becoming healthy."
              docker logs axoview-backend-ci || true
              exit 1
            fi

            sleep 1
          done

          echo "::error::Backend did not become healthy."
          docker logs axoview-backend-ci || true
          exit 1

      - name: Verify runtime contract
        shell: bash
        run: |
          HEALTH="$(curl --fail --silent http://127.0.0.1:3001/healthz)"
          CONFIG="$(curl --fail --silent http://127.0.0.1:3001/api/config)"

          echo "$HEALTH" | jq -e '.ok == true'
          echo "$CONFIG" | jq -e '.serverStorage == false'

          STATUS="$(curl --silent --output /tmp/storage.json --write-out '%{http_code}'             http://127.0.0.1:3001/api/diagrams)"

          test "$STATUS" = "503"
          jq -e '.error == "Server storage is disabled"' /tmp/storage.json

      - name: Upload backend logs on failure
        if: failure()
        run: docker logs axoview-backend-ci > backend-container.log 2>&1 || true

      - name: Upload smoke output
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-docker-smoke-output
          path: backend-container.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop backend container
        if: always()
        run: docker rm -f axoview-backend-ci >/dev/null 2>&1 || true

  docker-gate:
    name: Docker Gate
    if: always()
    needs: [docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Assert the backend smoke passed
        run: |
          echo "docker-smoke result: ${{ needs.docker-smoke.result }}"
          if [ "${{ needs.docker-smoke.result }}" != "success" ]; then
            echo "::error::Docker Gate: backend production image smoke did not pass (result=${{ needs.docker-smoke.result }})"
            exit 1
          fi
