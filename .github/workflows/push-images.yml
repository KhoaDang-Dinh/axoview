name: Push images to ECR

# Manual, human-triggered release to AWS. Run it from the branch to release
# (Actions -> Push images to ECR -> Run workflow) on dev or master.
#
# This repository's only job is to put two immutable images in ECR, tagged
# <branch>-<sha>:
#   axoview-backend   Dockerfile.backend
#   axoview-frontend  Dockerfile, target `frontend` (static files under /site)
# Everything after that is GitOps in KhoaDang-Dinh/infra_website: Argo CD
# Image Updater in the dev cluster notices the new tag, commits it to the dev
# overlay and Argo CD deploys it (API to EKS, frontend to S3 + CloudFront);
# prod gets a master-<sha> release only through infra_website's
# "Promote dev to prod" pull request.
#
# Two jobs: the release checks run on a GitHub-hosted runner (it has gh and
# jq); only the push runs on this repository's self-hosted runner
# (Ubuntu, PowerUserAccess); it installs AWS CLI v2 and Docker if missing. It assumes
# the push-only role infra_website's Terraform creates and finds it, and the
# repository names, in SSM (/axoview/bootstrap/*), so the only setting here is
# the repository variable AWS_REGION. No keys or tokens are stored.

on:
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: push-images-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  gates:
    if: ${{ github.repository == 'KhoaDang-Dinh/axoview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      APP_SHA: ${{ github.sha }}

    steps:
      - name: Require a release branch and AWS_REGION
        id: release
        shell: bash
        run: |
          case "$GITHUB_REF_NAME" in
            dev|master) echo "tag=$GITHUB_REF_NAME-$APP_SHA" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Run this from dev or master (got '$GITHUB_REF_NAME'). Only those branches are released."
              exit 1
              ;;
          esac
          if [ -z "$AWS_REGION" ]; then
            echo "::error::Set the repository variable AWS_REGION (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - name: Require green application gates
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          for _ in $(seq 1 90); do
            CHECKS="$(gh api "repos/$GITHUB_REPOSITORY/commits/$APP_SHA/check-runs?per_page=100")"
            CI_GATE="$(jq -r '[.check_runs[] | select(.name == "CI Gate")][0].conclusion // ""' <<<"$CHECKS")"
            DOCKER_GATE="$(jq -r '[.check_runs[] | select(.name == "Docker Gate")][0].conclusion // ""' <<<"$CHECKS")"

            echo "CI Gate=${CI_GATE:-pending} Docker Gate=${DOCKER_GATE:-pending}"
            if [ "$CI_GATE" = "success" ] && [ "$DOCKER_GATE" = "success" ]; then
              exit 0
            fi
            case "$CI_GATE:$DOCKER_GATE" in
              *failure*|*cancelled*|*timed_out*|*action_required*)
                echo "::error::A required gate failed for $APP_SHA; fix it before releasing."
                exit 1
                ;;
            esac
            sleep 20
          done

          echo "::error::Timed out waiting for CI Gate and Docker Gate on $APP_SHA."
          exit 1

  push:
    needs: gates
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
      APP_SHA: ${{ github.sha }}

    steps:
      # The runner is Ubuntu. Anything missing is installed with apt (passwordless
      # sudo), except AWS CLI v2: Ubuntu's awscli package is v1 (22.04) or gone
      # (24.04), so it comes from AWS's official installer.
      - name: Ensure runner tools (AWS CLI v2, Docker)
        shell: bash
        run: |
          set -euo pipefail
          sudo -n true 2>/dev/null || {
            echo "::error::Runner $RUNNER_NAME needs passwordless sudo to install missing tools (or install AWS CLI v2 and Docker yourself)."
            exit 1
          }
          apt_install() {
            sudo -n apt-get update -qq
            sudo -n DEBIAN_FRONTEND=noninteractive apt-get install -y -qq "$@"
          }

          if ! aws --version 2>&1 | grep -q '^aws-cli/2'; then
            echo "Installing AWS CLI v2 (found: $(aws --version 2>&1 || echo none))."
            if ! command -v curl >/dev/null || ! command -v unzip >/dev/null; then apt_install curl unzip; fi
            tmp="$(mktemp -d)"
            curl -fsSL "https://awscli.amazonaws.com/awscli-exe-linux-$(uname -m).zip" -o "$tmp/awscliv2.zip"
            unzip -q "$tmp/awscliv2.zip" -d "$tmp"
            sudo -n "$tmp/aws/install" --update
            rm -rf "$tmp"
            hash -r
          fi

          if ! command -v docker >/dev/null; then
            echo "Installing Docker (docker.io)."
            apt_install docker.io
            apt_install docker-buildx || echo "docker-buildx not available; using the classic builder."
            sudo -n systemctl enable --now docker
            sudo -n usermod -aG docker "$(id -un)"
          fi

          # A docker group added just now only applies after the runner service
          # restarts; until then this job uses sudo for docker.
          if docker info >/dev/null 2>&1; then
            echo "DOCKER=docker" >> "$GITHUB_ENV"
          elif sudo -n docker info >/dev/null 2>&1; then
            echo "::warning::$(id -un) is not in the docker group yet; using sudo docker. Restart the runner service once (sudo ./svc.sh stop && sudo ./svc.sh start in the runner directory)."
            echo "DOCKER=sudo -n docker" >> "$GITHUB_ENV"
          else
            echo "::error::Docker is installed on $RUNNER_NAME but its daemon is not running (sudo systemctl status docker)."
            exit 1
          fi

          aws --version
          ${DOCKER:-docker} version --format 'Docker {{.Server.Version}}' 2>/dev/null || sudo -n docker version --format 'Docker {{.Server.Version}}'

      - uses: actions/checkout@v6

      # The runner's own credentials only read the contract and assume the role;
      # everything after this step runs as the push-only role.
      - name: Assume the image publisher role
        id: aws
        shell: bash
        run: |
          set -euo pipefail
          # Published by infra_website's bootstrap (Apply infrastructure from dev).
          param() {
            local value
            if ! value="$(aws ssm get-parameter --name "/axoview/bootstrap/$1" \
                            --query Parameter.Value --output text 2>&1)"; then
              echo "::error::Cannot read SSM /axoview/bootstrap/$1: $value" >&2
              echo "::error::infra_website's bootstrap publishes it. If it is missing, run Apply infrastructure from infra_website dev with the image publisher change merged." >&2
              return 1
            fi
            printf '%s' "$value"
          }
          ROLE_ARN="$(param image_publisher_role_arn)"
          BACKEND_REPOSITORY="$(param ecr_repository)"
          FRONTEND_REPOSITORY="$(param ecr_frontend_repository)"

          if ! CREDS="$(aws sts assume-role \
                --role-arn "$ROLE_ARN" \
                --role-session-name "axoview-push-$GITHUB_RUN_ID" \
                --duration-seconds 3600 \
                --query 'Credentials.[AccessKeyId,SecretAccessKey,SessionToken]' --output text 2>&1)"; then
            echo "::error::Cannot assume $ROLE_ARN with the runner's credentials ($(aws sts get-caller-identity --query Arn --output text 2>&1)): $CREDS"
            exit 1
          fi
          read -r KEY SECRET TOKEN <<<"$CREDS"
          if [ -z "$KEY" ] || [ -z "$SECRET" ] || [ -z "$TOKEN" ]; then
            echo "::error::assume-role returned no credentials for $ROLE_ARN."
            exit 1
          fi
          echo "::add-mask::$KEY"
          echo "::add-mask::$SECRET"
          echo "::add-mask::$TOKEN"
          {
            echo "AWS_ACCESS_KEY_ID=$KEY"
            echo "AWS_SECRET_ACCESS_KEY=$SECRET"
            echo "AWS_SESSION_TOKEN=$TOKEN"
          } >> "$GITHUB_ENV"

          ACCOUNT_ID="${ROLE_ARN#arn:aws:iam::}"; ACCOUNT_ID="${ACCOUNT_ID%%:*}"
          {
            echo "registry=$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
            echo "backend=$BACKEND_REPOSITORY"
            echo "frontend=$FRONTEND_REPOSITORY"
          } >> "$GITHUB_OUTPUT"
          echo "Pushing as $ROLE_ARN to $BACKEND_REPOSITORY and $FRONTEND_REPOSITORY."

      # Tags are immutable in ECR: a tag that already exists is this exact
      # commit's image, so re-running only pushes what is missing.
      - name: Build and push release images
        id: push
        shell: bash
        env:
          REGISTRY: ${{ steps.aws.outputs.registry }}
          BACKEND_REPOSITORY: ${{ steps.aws.outputs.backend }}
          FRONTEND_REPOSITORY: ${{ steps.aws.outputs.frontend }}
          TAG: ${{ needs.gates.outputs.tag }}
        run: |
          set -euo pipefail
          aws ecr get-login-password | $DOCKER login --username AWS --password-stdin "$REGISTRY"

          push() {   # push <output-name> <repository> <docker build args...>
            local name="$1" repo="$2"; shift 2
            local image="$REGISTRY/$repo:$TAG"
            if aws ecr describe-images --repository-name "$repo" --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
              echo "$image already exists; not rebuilding."
            else
              $DOCKER build --platform linux/amd64 -t "$image" "$@" .
              $DOCKER push "$image"
            fi
            echo "$name=$image" >> "$GITHUB_OUTPUT"
          }

          push backend "$BACKEND_REPOSITORY" -f Dockerfile.backend
          push frontend "$FRONTEND_REPOSITORY" -f Dockerfile --target frontend

      # Shared runner: leave no registry login or session behind.
      - name: Clean up credentials
        if: ${{ always() }}
        shell: bash
        env:
          REGISTRY: ${{ steps.aws.outputs.registry }}
        run: |
          if [ -n "$REGISTRY" ]; then ${DOCKER:-docker} logout "$REGISTRY" >/dev/null 2>&1 || true; fi

      - name: Summary
        if: ${{ always() }}
        shell: bash
        env:
          BACKEND_IMAGE: ${{ steps.push.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.push.outputs.frontend }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # shellcheck disable=SC2016
          {
            printf '## Release images (%s)\n\n' "$JOB_STATUS"
            printf -- '- Axoview: `%s` at `%s`\n' "$GITHUB_REF_NAME" "$APP_SHA"
            printf -- '- Backend: `%s`\n' "${BACKEND_IMAGE:-n/a}"
            printf -- '- Frontend: `%s`\n' "${FRONTEND_IMAGE:-n/a}"
            printf '\nDev picks these up automatically (Argo CD Image Updater, within a few minutes).'
            printf ' Prod: run "Promote dev to prod" in infra_website once dev runs a master release.\n'
          } >> "$GITHUB_STEP_SUMMARY"
