name: Deploy AWS service

on:
  workflow_dispatch:
    inputs:
      deploy_frontend:
        description: Deploy the static frontend to S3/CloudFront
        required: true
        default: true
        type: boolean
      deploy_backend:
        description: Build the API image and roll it out to EKS
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: axoview-aws-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
      FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      API_ORIGIN_HOST: ${{ vars.API_ORIGIN_HOST }}
      ALB_CERTIFICATE_ARN: ${{ vars.ALB_CERTIFICATE_ARN }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Node.js
        if: ${{ inputs.deploy_frontend }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build frontend
        if: ${{ inputs.deploy_frontend }}
        run: |
          npm ci
          npm run build

      - name: Publish frontend to S3
        if: ${{ inputs.deploy_frontend }}
        run: |
          BUILD=packages/axoview-app/build

          aws s3 sync "$BUILD/" "s3://$FRONTEND_BUCKET/" \
            --delete \
            --cache-control "public,max-age=300"

          if [ -d "$BUILD/static" ]; then
            aws s3 sync "$BUILD/static/" "s3://$FRONTEND_BUCKET/static/" \
              --cache-control "public,max-age=31536000,immutable"
          fi

          for html in index.html app.html 404.html; do
            if [ -f "$BUILD/$html" ]; then
              aws s3 cp "$BUILD/$html" "s3://$FRONTEND_BUCKET/$html" \
                --content-type "text/html; charset=utf-8" \
                --cache-control "no-cache"
            fi
          done

          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/" "/app*" "/*.html"

      - name: Log in to Amazon ECR
        if: ${{ inputs.deploy_backend }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push backend image
        if: ${{ inputs.deploy_backend }}
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE_URI="$REGISTRY/$ECR_REPOSITORY:${GITHUB_SHA}"
          docker build -f Dockerfile.backend -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Configure kubectl
        if: ${{ inputs.deploy_backend }}
        run: |
          aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"

      - name: Deploy backend to EKS
        if: ${{ inputs.deploy_backend }}
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/serviceaccount.yaml

          kubectl -n axoview create configmap axoview-runtime \
            --from-literal="PUBLIC_BASE_URL=https://$DOMAIN_NAME" \
            --dry-run=client -o yaml | kubectl apply -f -

          sed "s|axoview-backend:local|$IMAGE_URI|g" deploy/k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f deploy/k8s/service.yaml
          kubectl apply -f deploy/k8s/hpa.yaml

          sed \
            -e "s|__API_ORIGIN_HOST__|$API_ORIGIN_HOST|g" \
            -e "s|__ALB_CERTIFICATE_ARN__|$ALB_CERTIFICATE_ARN|g" \
            deploy/k8s/ingress.yaml.tpl | kubectl apply -f -

          kubectl -n axoview rollout status deployment/axoview-api --timeout=5m
