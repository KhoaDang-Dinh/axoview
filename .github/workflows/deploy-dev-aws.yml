name: Deploy dev to AWS

on:
  push:
    branches: ["dev"]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Optional exact Axoview dev SHA to deploy
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: axoview-aws-dev
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.ENABLE_AWS_DEV_CD == 'true' }}
    uses: ./.github/workflows/deploy-aws.yml
    with:
      environment: dev
      source_branch: dev
      release_sha: ${{ inputs.release_sha }}
      aws_region: ${{ vars.AWS_DEV_REGION || vars.AWS_REGION }}
      role_arn: ${{ vars.AWS_DEV_DEPLOY_ROLE_ARN }}
